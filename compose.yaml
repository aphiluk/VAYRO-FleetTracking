name: vayro-fleettracking

x-healthcheck: &healthcheck
  test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/'); if (!r.ok) process.exit(1)"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  gateway:
    build:
      context: .
      target: api
      args:
        SERVICE: gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3001}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  auth-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/auth-service
    ports:
      - "127.0.0.1:${AUTH_PORT:-3002}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  tracking-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/tracking-service
    environment:
        TRACKING_API_TOKENS: "${TRACKING_API_TOKENS:-}"
    ports:
      - "127.0.0.1:${TRACKING_PORT:-3003}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

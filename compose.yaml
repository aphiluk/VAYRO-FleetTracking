name: vayro-fleettracking

x-healthcheck: &healthcheck
  test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/'); if (!r.ok) process.exit(1)"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 45s

# Each data owner uses its own database and login role. Calls between services use /internal/*.
x-internal: &internal
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?copy .env.example to .env}

services:
  web:
    build:
      context: .
      target: web
    environment:
      API_URL: http://gateway:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vayro
      POSTGRES_USER: vayro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      # One password per service database. Only this container sees all of them; each service gets only its own
      # (in its DATABASE_URL) and never the POSTGRES_PASSWORD of the admin account.
      DB_PASSWORD_AUTH: ${DB_PASSWORD_AUTH:?copy .env.example to .env}
      DB_PASSWORD_COMPANY: ${DB_PASSWORD_COMPANY:?copy .env.example to .env}
      DB_PASSWORD_USER: ${DB_PASSWORD_USER:?copy .env.example to .env}
      DB_PASSWORD_VEHICLE: ${DB_PASSWORD_VEHICLE:?copy .env.example to .env}
      DB_PASSWORD_GPS_DEVICE: ${DB_PASSWORD_GPS_DEVICE:?copy .env.example to .env}
      DB_PASSWORD_GPS_DATA: ${DB_PASSWORD_GPS_DATA:?copy .env.example to .env}
      DB_PASSWORD_TRANSPORT: ${DB_PASSWORD_TRANSPORT:?copy .env.example to .env}
      DB_PASSWORD_ALERT: ${DB_PASSWORD_ALERT:?copy .env.example to .env}
      DB_PASSWORD_INTEGRATION: ${DB_PASSWORD_INTEGRATION:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on a new volume only: creates one database + role per service. For an existing volume see docs/DATABASE.md.
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    init: true
    restart: unless-stopped
    healthcheck:
      # The init server only listens on a Unix socket. Wait for the server migrations will reach over TCP.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vayro", "-d", "vayro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 1. Authentication. Owns: auth_sessions. Signs tokens and tells other services who a caller is.
  auth-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/auth-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://auth_svc:${DB_PASSWORD_AUTH:?copy .env.example to .env}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      USER_SERVICE_URL: http://user-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 2. Company. Owns: company. Registration and workspace status.
  company-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/company-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://company_svc:${DB_PASSWORD_COMPANY:?copy .env.example to .env}@postgres:5432/company_db
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 3. User. Owns: users. Accounts and roles; checks passwords for auth-service.
  user-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/user-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://user_svc:${DB_PASSWORD_USER:?copy .env.example to .env}@postgres:5432/user_db
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 4. Vehicle. Owns vehicle_types and vehicles, with public company-scoped management APIs.
  vehicle-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/vehicle-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://vehicle_svc:${DB_PASSWORD_VEHICLE:?copy .env.example to .env}@postgres:5432/vehicle_db
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 5. GPS Device. Owns: gps_devices.
  gps-device-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/gps-device-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://gps_device_svc:${DB_PASSWORD_GPS_DEVICE:?copy .env.example to .env}@postgres:5432/gps_device_db
      # Optional. Without it the service runs, but saving provider credentials is refused (503).
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:-}"
      AUTH_SERVICE_URL: http://auth-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 6. GPS Data. Owns: gps_locations. Ingest and stored positions.
  gps-data-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/gps-data-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://gps_data_svc:${DB_PASSWORD_GPS_DATA:?copy .env.example to .env}@postgres:5432/gps_data_db
      TRACKING_API_TOKENS: "${TRACKING_API_TOKENS:-}"
      # Optional best-effort HTTP delivery. Alert receives events when configured below.
      GPS_EVENT_SUBSCRIBERS: "${GPS_EVENT_SUBSCRIBERS:-}"
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      GPS_DEVICE_SERVICE_URL: http://gps-device-service:3000
      TRANSPORT_SERVICE_URL: http://transport-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
      vehicle-service:
        condition: service_healthy
      gps-device-service:
        condition: service_healthy
      transport-service:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 7. Vehicle Tracking. No database; skeleton (no routes yet).
  tracking-service:
    profiles: [scaffold]
    build:
      context: .
      target: api
      args:
        SERVICE: services/tracking-service
    environment:
      <<: *internal
      AUTH_SERVICE_URL: http://auth-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      GPS_DEVICE_SERVICE_URL: http://gps-device-service:3000
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 8. Route History. No database: reads stored points from gps-data-service.
  route-history-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/route-history-service
    environment:
      <<: *internal
      AUTH_SERVICE_URL: http://auth-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      TRANSPORT_SERVICE_URL: http://transport-service:3000
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 9. Transport Job. Owns transport_jobs and system_log.
  transport-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/transport-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://transport_svc:${DB_PASSWORD_TRANSPORT:?copy .env.example to .env}@postgres:5432/transport_db
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
      # Optional: raises "new job" / "job problem" alerts and pauses the offline check when a job ends.
      ALERT_SERVICE_URL: http://alert-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 10. Alert & Geofence. Owns: alert_rules, geofences, alerts (+ its own system_log and vehicle_signal_state).
  alert-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/alert-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://alert_svc:${DB_PASSWORD_ALERT:?copy .env.example to .env}@postgres:5432/alert_db
      AUTH_SERVICE_URL: http://auth-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      TRANSPORT_SERVICE_URL: http://transport-service:3000
      USER_SERVICE_URL: http://user-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 11. Reporting & Dashboard. Stateless company counts from owning services.
  reporting-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/reporting-service
    environment:
      <<: *internal
      COMPANY_SERVICE_URL: http://company-service:3000
      GPS_DEVICE_SERVICE_URL: http://gps-device-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      ALERT_SERVICE_URL: http://alert-service:3000
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      TRANSPORT_SERVICE_URL: http://transport-service:3000
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 12. Integration & Logging. Owns: api_integrations, api_request_logs, system_log.
  integration-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/integration-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://integration_svc:${DB_PASSWORD_INTEGRATION:?copy .env.example to .env}@postgres:5432/integration_db
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
      # GET /api/v1/system-logs also collects the audit rows of these services over their /internal/system-logs.
      TRANSPORT_SERVICE_URL: http://transport-service:3000
      ALERT_SERVICE_URL: http://alert-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 13. Navigation preview. Stateless Photon geocoding and Valhalla automobile routing.
  navigation-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/navigation-service
    environment:
      <<: *internal
      AUTH_SERVICE_URL: http://auth-service:3000
      NAVIGATION_GEOCODING_URL: ${NAVIGATION_GEOCODING_URL:-https://photon.komoot.io/api/}
      NAVIGATION_ROUTING_URL: ${NAVIGATION_ROUTING_URL:-https://valhalla1.openstreetmap.de/route}
    depends_on:
      auth-service:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  gateway:
    build:
      context: .
      target: api
      args:
        SERVICE: gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
      USER_SERVICE_URL: http://user-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      GPS_DEVICE_SERVICE_URL: http://gps-device-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      TRANSPORT_SERVICE_URL: http://transport-service:3000
      REPORTING_SERVICE_URL: http://reporting-service:3000
      NAVIGATION_SERVICE_URL: http://navigation-service:3000
      ROUTE_HISTORY_SERVICE_URL: http://route-history-service:3000
      ALERT_SERVICE_URL: http://alert-service:3000
      INTEGRATION_SERVICE_URL: http://integration-service:3000
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-3001}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

volumes:
  pgdata:
